<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients matching the 3D brand logo -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7426"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="45%" stop-color="#FFF2B2"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#8B651B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A651E"/>
    </linearGradient>

    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#FFF8D0"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <filter id="subtleBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Flight swoosh path curving over the letter M towards the airplane -->
  <path d="M 160 82 C 185 45, 235 24, 298 22" 
        fill="none" 
        stroke="url(#swooshGrad)" 
        stroke-width="5" 
        stroke-linecap="round"/>
  <path d="M 185 72 C 215 38, 255 24, 296 22" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="1.8" 
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- Golden Passenger Jet Airplane Icon (banking 35 degrees upward to the right) -->
  <g transform="translate(305, 14) rotate(24) scale(0.95)" filter="url(#subtleBevel)">
    <!-- Airplane Body & Wings -->
    <path d="M 0 15 
             C 0 10, 2 2, 4 0 
             C 6 2, 8 10, 8 15 
             L 24 24 
             L 24 28 
             L 8 22 
             L 8 36 
             L 14 41 
             L 14 43 
             L 4 41 
             L -6 43 
             L -6 41 
             L 0 36 
             L 0 22 
             L -16 28 
             L -16 24 
             Z" 
          fill="url(#goldGradient)" 
          stroke="#FFEAA3" 
          stroke-width="0.75" />
    <!-- Wing glint highlight -->
    <path d="M 4 2 L 4 40" stroke="#FFF" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Main Wordmark: IMAAD -->
  <!-- Layer 1: Gold 3D Bevel Rim -->
  <text x="270" y="105" 
        text-anchor="middle" 
        font-family="'Cinzel', Georgia, serif" 
        font-weight="800" 
        font-size="94" 
        letter-spacing="5"
        fill="#0A0A0A" 
        stroke="url(#goldBright)" 
        stroke-width="4.5"
        stroke-linejoin="round"
        filter="url(#subtleBevel)">
    IMAAD
  </text>

  <!-- Layer 2: Glossy Inner Face -->
  <text x="270" y="105" 
        text-anchor="middle" 
        font-family="'Cinzel', Georgia, serif" 
        font-weight="800" 
        font-size="94" 
        letter-spacing="5"
        fill="#121212">
    IMAAD
  </text>

  <!-- Layer 3: Gold Metallic Accent Top Shimmer -->
  <text x="270" y="105" 
        text-anchor="middle" 
        font-family="'Cinzel', Georgia, serif" 
        font-weight="800" 
        font-size="94" 
        letter-spacing="5"
        fill="url(#goldGradient)"
        opacity="0.35">
    IMAAD
  </text>

  <!-- Second Line: INTERNATIONAL -->
  <text x="270" y="152" 
        text-anchor="middle" 
        font-family="'Cinzel', Georgia, serif" 
        font-weight="700" 
        font-size="33" 
        letter-spacing="7"
        fill="url(#goldBright)"
        filter="url(#subtleBevel)">
    INTERNATIONAL
  </text>

  <!-- Third Line: TOURS & TRAVELS with flanking tapered golden darts -->
  <!-- Left Tapered Dart -->
  <polygon points="30,188 115,185 115,191" fill="url(#goldGradient)" />
  <!-- Right Tapered Dart -->
  <polygon points="510,188 425,185 425,191" fill="url(#goldGradient)" />

  <text x="270" y="195" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-weight="800" 
        font-size="22" 
        letter-spacing="5.5"
        fill="url(#goldBright)"
        filter="url(#subtleBevel)">
    TOURS &amp; TRAVELS
  </text>
</svg>
